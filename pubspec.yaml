name: waypoint
description: >-
  Waypoint — a free, local-first, cross-platform project management app for
  small teams and personal projects. All features free; optional paid sync.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.0
  drift: ^2.28.0
  drift_flutter: ^0.2.5
  path_provider: ^2.1.5
  path: ^1.9.0
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  drift_dev: ^2.28.0
  build_runner: ^2.7.0
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
