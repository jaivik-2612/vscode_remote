# /etc/phosh/phoc.ini in the experiment's overlay (runs 3 to 7): Antumbra's
# /etc/antumbra/phoc.ini of 9 Oct 2026 plus the nested output. phoc's X11
# backend names its window X11-1; 720x1560 at scale 2 is 360x780 logical.
[core]
xwayland=false

[output:DSI-1]
scale = 3
mode = 1440x3120@60Hz

[output:Virtual-1]
scale = 2

[output:X11-1]
mode = 720x1560
scale = 2
