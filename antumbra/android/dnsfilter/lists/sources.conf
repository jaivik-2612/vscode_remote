# Antumbra: where antumbra-dnsfilter's block list and the firewall's list of
# DNS-over-HTTPS server addresses come from.
#
# fetch-lists.sh downloads every https:// source (in CI, never on the
# phone) and listc compiles them. The record format is described in
# internal/listc/config.go:
#
#   block   NAME FORMAT MIN WHERE   blocked domains (each with its subdomains)
#   ipv4    NAME MIN WHERE          DoH server addresses for antumbra-fw
#   exclude NAME FILE               entries of source NAME to leave out
#   allow   FILE                    domains never blocked
#   guard   DOMAIN...               domains that must not end up blocked;
#                                   the build stops if one is
#   licence NAME TEXT...            licence note copied into the list header
#
# The remote lists change several times a day, so their contents cannot be
# pinned by hash. What is pinned is the URL; downloads use HTTPS only, the
# compiled list records the SHA-256 of every download in its header, and
# MIN (the least number of usable entries) catches a truncated or empty
# download. fetch-lists.sh --expect NAME=SHA256 pins a download exactly,
# to rebuild an earlier list.
#
# Entry counts below were checked on 2026-10-11.

# HaGeZi Multi PRO, wildcard form: 193,358 domains, each standing for itself
# and its subdomains. Ads, trackers, telemetry, malware. It already contains
# HaGeZi's OPPO/Realme native tracker list (OnePlus's parent company).
block   hagezi-pro     domains 150000 https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/pro-onlydomains.txt
licence hagezi-pro     GPL-3.0, https://github.com/hagezi/dns-blocklists

# HaGeZi Encrypted DNS Bypass: 3,272 host names of DoH and DoT servers.
# Apps that bring their own encrypted DNS cannot find their server and fall
# back to the system's lookups, which pass through this filter.
block   hagezi-doh     domains 1000   https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/doh-onlydomains.txt
licence hagezi-doh     GPL-3.0, https://github.com/hagezi/dns-blocklists

# Exodus Privacy tracker list: OFF until two things are settled (queue DNS3;
# README, "Sources"). Its signatures are regular expressions written to find
# SDKs in app code, not block-list entries: read as domains, 203 of the 622
# are in no HaGeZi list, and many of those block a company's whole site
# (matomo.org, qualtrics.com, onesignal.com) or a working service (Mapbox
# tiles, the GIPHY API, ID-verification SDKs). And its data is under the
# Open Database Licence 1.0 (contents: DbCL 1.0), whose share-alike terms
# have not been checked against HaGeZi's GPL-3.0 for one merged list. To
# turn it on, review exodus-exclude.txt against the source and uncomment:
#block   exodus         etip    300    https://reports.exodus-privacy.eu.org/api/trackers
#licence exodus         ODbL-1.0 (contents DbCL-1.0), Exodus Privacy, https://reports.exodus-privacy.eu.org
#exclude exodus         exodus-exclude.txt

# Antumbra's own list: phone-home endpoints of this phone's software.
block   antumbra       domains 5      antumbra-extra.txt
licence antumbra       GPL-3.0, Antumbra

# Exceptions, for names that the lists block wrongly and that break apps.
allow   allow.txt

# Sites and services that no tracker list should block as a whole. If a
# source update blocks one of these (or a parent of it), the build stops so
# that a person looks at it. This also catches a poisoned source.
guard   google.com facebook.com apple.com microsoft.com login.microsoftonline.com
guard   wikipedia.org wikimedia.org openstreetmap.org mozilla.org duckduckgo.com
guard   torproject.org f-droid.org guardianproject.info lineageos.org download.lineageos.org
guard   github.com signal.org briarproject.org onionshare.org proton.me debian.org

# HaGeZi's list of DoH server addresses: 1,434 IPv4 addresses (single
# addresses only; at most 4,096, see internal/listc). antumbra-fw
# rejects new TCP connections to them (lists/doh-ipv4.txt on the phone).
ipv4    hagezi-doh-ips 1000           https://raw.githubusercontent.com/hagezi/dns-blocklists/main/ips/doh.txt
licence hagezi-doh-ips GPL-3.0, https://github.com/hagezi/dns-blocklists
