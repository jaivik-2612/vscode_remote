#
# Antumbra module: the Settings.Global values service.sh sets at every boot,
# once the framework answers. Android stores them, so they hold even on a
# boot without the module. customize.sh records what was there before
# (settings.orig) and uninstall.sh puts it back.
#
# Format: KEY=VALUE, one per line. A line starting with "lineage:" is set
# on LineageOS only; one starting with "phone:" everywhere but the Android
# emulator (no line uses it at present); one starting with "cell:" is
# never set at boot: the cell radio's watch in service.sh sets it when the
# time is right, and customize.sh and uninstall.sh record and put back its
# old value like the others'. Lines starting with '#' and blank lines are
# ignored. service.sh sets them again when Android begins to shut down
# (best effort), so that a session's changes (MAC "keep", mobile data
# switched on, the cell radio switched on) do not outlast it on a start
# without the module.

# No connectivity check: Android would contact Google on every network.
# (captive_portal_detection_enabled is the older key for the same.)
captive_portal_mode=0
captive_portal_detection_enabled=0
# Network time goes nowhere: NTP to 127.0.0.1 is refused by the firewall.
# Time over Tor is later work.
ntp_server=127.0.0.1
# No SUPL or XTRA location assistance downloads.
assisted_gps_enabled=0
# No Wi-Fi or Bluetooth scanning for location while they are off. Wi-Fi
# copies its value into its own store at boot; that store is in RAM here.
wifi_scan_always_enabled=0
ble_scan_always_enabled=0
# DNS goes to the system resolver and from there to the DNS filter; no
# DNS-over-TLS to a server of Android's choice.
private_dns_mode=off
# No network-scoring service.
network_recommendations_enabled=0
# If tethering is ever switched on, it stays in the kernel instead of the
# hardware offload, which bypasses netfilter. (Welcome forbids tethering.)
tether_offload_disabled=1
# A new random Wi-Fi MAC address for every connection. service.sh sets 0
# instead when the person chose "keep" on the Welcome screen.
non_persistent_mac_randomization_force_enabled=1
# Restricted networking mode. On LineageOS 23.2 it enforces each app's
# "Network access" switch (POLICY_REJECT_ALL), which Welcome uses to cut
# off apps that need no network. netd's eBPF program exempts every uid
# below 10000, so tor (2950), the DNS filter (2951) and the system are
# never affected. Plain Android (the CI emulator) would instead block every
# app without a privileged permission, even on loopback, so it is set on
# LineageOS only.
lineage:restricted_networking_mode=1
# Mobile data off. A SIM connects outside Wi-Fi's RAM-only store, so this
# stored value is the fail-safe for a start without the module (Magisk Safe
# Mode, an update without the Magisk step): with it, a SIM Android knows
# does not connect. Mobile data is a choice made at Start (Welcome's
# Internet: mobile data through Tor, where this phone's gate allows it;
# WEL8): service.sh switches it on only for such a session, and in every
# other session switches it off again whenever something switches it on.
# mobile_data is the key with
# one SIM slot; in dual-SIM mode (the hotdog has two slots) Android keeps
# one key per SIM, mobile_data<subId>, which service.sh sets to 0 for every
# SIM it finds (mobile_data_off in antumbra.sh). On the emulator too: CI
# switches its simulated mobile data off itself.
mobile_data=0
# No background cellular request kept up while Wi-Fi is the default
# network (ConnectivityService; Android's default is 1). It matters only
# when mobile data is on.
mobile_data_always_on=0
# The cell radio off from power-on: the phone process reads this once, when
# it starts, and keeps the radio off until airplane mode is switched on and
# off, or an emergency call switches it on (which Android always may). It
# holds on a start without the module too. Android's airplane-mode path sets
# it back to 1 whenever it switches the radio on; service.sh writes 0 again
# once no call, callback mode or 5-minute hold keeps the radio on, and
# keeps 1 while one does, so that a restart of the phone process then does
# not switch the radio off (lib/antumbra.sh, "The cell radio").
enable_cellular_on_boot=0
# Airplane mode switches the cell radio only (Android's default is
# cell,bluetooth,uwb,wifi,wimax), so that the module can switch the cell
# radio off at run time without touching Wi-Fi or Bluetooth. Not set at
# boot: service.sh narrows the list once airplane mode has been off for 30
# seconds, because Wi-Fi follows airplane mode only while the list names
# Wi-Fi.
cell:airplane_mode_radios=cell
