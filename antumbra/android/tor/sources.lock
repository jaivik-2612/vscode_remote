# Antumbra: pinned inputs for build-tor.sh.
#
# One record per line: KIND NAME VALUE... Blank lines and lines starting
# with '#' are ignored. build-tor.sh refuses to unpack any tarball whose
# SHA-256 differs from the value here. When gpg is installed it also checks
# the publisher's OpenPGP signature and accepts it only from a primary key
# listed under 'signer'.
#
# To update a source: download the new tarball and its signature from the
# URLs below, check the signature by hand against the listed fingerprints,
# then change the version, file name, SHA-256 and URLs together, and run
# build-tor.sh once with '--signatures require'.
#
# Checked on 2026-10-11:
#   tor 0.4.9.14 (2026-10-07) is the newest stable release on
#   dist.torproject.org and torproject.org/download/tor.
#   OpenSSL 3.5 is the current LTS series (supported until 2030-04-08);
#   3.5.9 (2026-09-29) is its newest release.
#   libevent 2.1.12-stable is the newest stable libevent.
#   zlib 1.3.2 is the newest zlib release.

# Toolchain and target. The NDK revision is checked against the
# source.properties of the NDK in use. The API level is the minimum Android
# version the binary runs on (34 = Android 14).
ndk     28.2.13676358
api     34

# SOURCE_DATE_EPOCH for every build step: the time stamp of the tor
# tarball's top directory (2026-10-07 14:40:00 UTC).
epoch   1791384000

# --- tor ----------------------------------------------------------------
