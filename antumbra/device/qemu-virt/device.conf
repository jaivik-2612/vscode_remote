# Antumbra device profile: QEMU "virt" machine (arm64), for boot-testing the
# system without the phone. Build with ANTUMBRA_DEVICE=qemu-virt; outputs go
# to build/out/qemu-virt and build/work/qemu-virt. See docs/vm-testing.md.
#
# Everything is taken from the phone profile (same kernel sources, port
# patches, hardening fragment, same root filesystem hooks and overlay); this
# profile only adds the virtio devices to the kernel, a different command
# line, and a small disk image in place of the sparse userdata image.
BASE_DEVICE=oneplus-hotdog
KERNEL_LOCALVERSION=-antumbra-virt
# QEMU generates the device tree for the virt machine.
KERNEL_DTB=
# image.sh output: a raw GPT disk (IMAGE_OUTPUT=vmdisk) with one partition
# named "userdata" holding the same nested GPT the phone's userdata partition
# holds (live partition + Persistent Storage partition), 4096-byte sectors.
IMAGE_OUTPUT=vmdisk
USERDATA_PARTITION_SIZE=4294967296
