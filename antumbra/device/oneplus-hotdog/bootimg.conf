# Android boot image contract for the OnePlus 7T Pro (hotdog), as validated
# on hardware by the hotdog-linux-bringup port (deviceinfo and
# postprocess-boot-avb.sh at tag v0.2.0-alpha.2). Sourced by build/bootimg.sh
# and build/flash.sh.
HEADER_VERSION=2
PAGESIZE=4096
BASE=0x00000000
KERNEL_OFFSET=0x00008000
RAMDISK_OFFSET=0x01000000
SECOND_OFFSET=0x00000000
TAGS_OFFSET=0x00000100
DTB_OFFSET=0x01f00000
DTB=qcom/sm8150-oneplus-hotdog.dtb
# The ABL truncates the command line here and ignores extra_cmdline.
CMDLINE_MAX=511
# Partition sizes in bytes; flash.sh refuses to proceed if the device
# reports different values.
BOOT_PARTITION_SIZE=100663296
DTBO_PARTITION_SIZE=25165824
VBMETA_PARTITION_SIZE=65536
USERDATA_PARTITION_SIZE=232382812160
# Antumbra lives in slot B; slot A keeps the user's Android recovery.
SLOT=b
# Expected bootloader identity.
FASTBOOT_PRODUCT=msmnile
