PORT_TAG=v0.2.0-alpha.2
PORT_PATCH_BASE_URL=https://raw.githubusercontent.com/Sr-0w/hotdog-linux-bringup/v0.2.0-alpha.2/aports/device/testing/linux-oneplus-hotdog-mainline617-clean
