# Android apps (fetched only with ANTUMBRA_ANDROID=1). Waydroid's LineageOS
# 20.0 (Android 13) images of 2026-09-27, VANILLA system (no Google apps)
# and MAINLINE vendor, as listed by Waydroid's OTA channel
# (https://ota.waydro.id/system/lineage/waydroid_<variant>/VANILLA.json and
# https://ota.waydro.id/vendor/waydroid_<variant>/MAINLINE.json; the files
# are on SourceForge). Waydroid itself checks only the zip's SHA-256 from
# that JSON; the build checks it, the zip's size, and the size and CRC-32
# the zip records for each image. *_IMG_SHA256 pins the extracted image,
# checked on every run, cached or not (for arm64: computed on 2026-10-05 by
# streaming each pinned zip through funzip, whose CRC-32 check passed). The
# device profile picks the variant (WAYDROID_IMAGE_VARIANT in device.conf).
