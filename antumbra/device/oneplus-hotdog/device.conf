# Antumbra device profile: OnePlus 7T Pro (hotdog). Sourced by build/lib/common.sh.
# The phone is the default profile; everything else in this directory
# (sources.lock, kernel/, bootimg.conf, keys/, firmware/) belongs to it.
BASE_DEVICE=oneplus-hotdog
# Kernel release suffix and the device tree blob the boot image carries.
KERNEL_LOCALVERSION=-antumbra
KERNEL_DTB=qcom/sm8150-oneplus-hotdog.dtb
# image.sh output: an Android sparse image of the userdata partition
# (IMAGE_OUTPUT=sparse) sized to the physical partition. bootimg.conf repeats
# the size for flash.sh; tests/lint.sh checks they agree.
IMAGE_OUTPUT=sparse
USERDATA_PARTITION_SIZE=232382812160
