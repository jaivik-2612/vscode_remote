# Antumbra: the Waydroid container service runs only in a session for which
# the user turned Android apps on at the Welcome screen
# (antumbra-apply-welcome-settings writes the flag), and only with its
# Tor-only network in place. Debian's package enables the unit at boot;
# the build hook disables it, and D-Bus activation of id.waydro.Container
# meets the same condition. Not masked, so nothing has to unmask it.
[Unit]
ConditionPathExists=/run/antumbra/android-enabled
Requires=antumbra-create-netns.service antumbra-waydroid-dhcp.service
After=nftables.service antumbra-create-netns.service antumbra-waydroid-dhcp.service
# Stopped (in reverse order) before the overlay's directories are emptied
# and before the return to the initramfs, so that the loop mounts of
# system.img and vendor.img are gone by then.
After=antumbra-remove-overlayfs-dirs.service initramfs-shutdown.service

[Service]
# Waydroid opens the binder devices to every user (0666) and the GPU render
# node, the DMA-BUF heaps and the framebuffers to every user (0777) when
# the container starts. When the service stops (antumbra-waydroid-stopped
# stops it once the container has stopped): the binder devices back to
# root-only, udev's own modes for the render node and the framebuffers,
# and root-only for the DMA-BUF heaps, as devtmpfs creates them (udev has
# no rule for them, so a change event would leave them at 0777).
ExecStopPost=/bin/chmod 0600 /dev/binder /dev/hwbinder /dev/vndbinder
ExecStopPost=-/usr/bin/udevadm trigger --action=change --subsystem-match=drm --sysname-match=renderD*
ExecStopPost=-/usr/bin/find /dev/dma_heap -mindepth 1 -maxdepth 1 -type c -exec /bin/chmod 0600 {} +
ExecStopPost=-/usr/bin/udevadm trigger --action=change --subsystem-match=graphics
