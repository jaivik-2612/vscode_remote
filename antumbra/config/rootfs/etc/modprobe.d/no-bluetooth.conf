# Tails' no-bluetooth.conf, extended with this phone's Bluetooth driver stack.
# The Welcome screen's opt-in Bluetooth session removes this file's effect
# for the session by loading the modules explicitly after setting a random
# address (antumbra-bluetooth-session).
install bluetooth /bin/true
install bnep /bin/true
install btusb /bin/true
install btqca /bin/true
install hci_uart /bin/true
