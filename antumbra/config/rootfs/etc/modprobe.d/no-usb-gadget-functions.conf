# No USB gadget functions are ever configured in userspace; keeping the
# function drivers unloadable makes a mistake fail closed.
install usb_f_rndis /bin/true
install usb_f_ncm /bin/true
install usb_f_ecm /bin/true
install usb_f_acm /bin/true
install usb_f_fs /bin/true
install usb_f_mass_storage /bin/true
install g_ether /bin/true
install g_serial /bin/true
install g_mass_storage /bin/true
