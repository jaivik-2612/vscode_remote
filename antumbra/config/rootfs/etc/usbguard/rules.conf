# Antumbra usbguard policy (ImplicitPolicyTarget=block): only hubs are
# authorised automatically so a dock enumerates; every other device needs
# the user's approval. Written by the build; Debian's package would otherwise
# generate an allow-list from the build host's devices.
allow with-interface equals { 09:00:00 }
allow with-interface equals { 09:00:01 }
allow with-interface equals { 09:00:02 }
