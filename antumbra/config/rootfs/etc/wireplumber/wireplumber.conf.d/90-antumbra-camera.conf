# Antumbra: cameras reach applications through libcamera inside PipeWire
# (WirePlumber's libcamera monitor, on by default, stays on), so PipeWire is
# meant to be the only user of the CAMSS media graph. See docs/camera.md.
#
# CAMSS also registers a raw V4L2 video node per VFE output. They deliver
# Bayer data without any image processing, and WirePlumber's V4L2 monitor
# would offer each of them to applications as a camera: its deduplication
# only drops the V4L2 nodes that libcamera reports using. A second user
# configuring the graph is also a risk on this port, where a wedged
# CSID/VFE needs a reboot. This rule keeps the V4L2 monitor away from all
# CAMSS nodes; other V4L2 cameras (a USB webcam) are unaffected.
#
# The rule must match a property that PipeWire's V4L2 udev monitor already
# provides when WirePlumber creates the device (monitors/v4l2/create-device.lua
# applies the rules there). api.v4l2.cap.driver = "qcom-camss" would match
# nothing: PipeWire adds it only after the device exists. Two keys that are
# present at that point, either one is enough:
# - device.product.name: the udev monitor takes it from ID_MODEL* or, for a
#   platform device with no USB or PCI model, from ID_V4L_PRODUCT, which
#   udev's v4l_id sets to the VIDIOC_QUERYCAP card name; CAMSS reports
#   "Qualcomm Camera Subsystem" (drivers/media/platform/qcom/camss/camss-video.c);
# - device.sysfs.path: the udev devpath, which for CAMSS's video nodes
#   contains the platform device "acb3000.camss" (sm8150.dtsi, camss@acb3000).
# This is read from the code (PipeWire 1.6.9 spa/plugins/v4l2/v4l2-udev.c,
# WirePlumber 0.5.12), not yet observed on the phone; hardware-validation.md
# has the pw-dump check. The VM exercises the same mechanism with vimc's
# card name (config/hooks/72-vm-camera.sh).
#
# If PipeWire cannot hold the CAMSS graph reliably on the phone, the fallback
# is the set-up the port uses instead: monitor.libcamera disabled and a
# Megapixels "raw" configuration (docs/camera.md).
monitor.v4l2.rules = [
  {
    matches = [
      {
        device.product.name = "Qualcomm Camera Subsystem"
      }
      {
        device.sysfs.path = "~.*[.]camss/video4linux/video[0-9]+$"
      }
    ]
    actions = {
      update-props = {
        device.disabled = true
      }
    }
  }
]
