# Persistent Storage features: name|directory on the volume|mount point|owner|mode[|off]
# Bind-mounted in this order by antumbra-persistence activate. "off": not
# created with the volume, only by "antumbra-persistence enable NAME".
# Images built with ANTUMBRA_ANDROID=1 append (config/hooks/56-session-android.sh)
#   android|waydroid|/home/amnesia/.local/share/waydroid|amnesia:amnesia|0700|off
# which the Welcome screen's "Keep Android apps and data" enables.
# There is no tor-bridges feature (/var/lib/tca, the directory of Tails' Tor
# Connection assistant, which Antumbra does not have); volumes created when
# there was one keep its empty "tca" directory, which nothing mounts.
persistent-folder|Persistent|/home/amnesia/Persistent|amnesia:amnesia|0700
welcome-settings|welcome-settings|/var/lib/antumbra/settings/persistent|antumbra-greeter:antumbra-greeter|0750
network-connections|nm-system-connections|/etc/NetworkManager/system-connections|root:root|0700
gnupg|gnupg|/home/amnesia/.gnupg|amnesia:amnesia|0700
ssh-client|ssh|/home/amnesia/.ssh|amnesia:amnesia|0700
# dotfiles|dotfiles| (handled specially: symlinked into /home/amnesia)
