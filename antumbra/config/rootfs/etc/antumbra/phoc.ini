# Compositor settings for the OnePlus 7T Pro panel (1440x3120). 60 Hz is the
# stable mode on the mainline port; 90 Hz has DSI transport errors.
[core]
xwayland=false

[output:DSI-1]
scale = 3
mode = 1440x3120@60Hz

# The QEMU test target (docs/vm-testing.md): a 720x1440 virtio display at
# scale 2 gives the same 360x720 logical size class as the phone.
[output:Virtual-1]
scale = 2
