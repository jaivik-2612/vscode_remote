# Antumbra additions to Tails' NetworkManager configuration.
[main]
# The hostname is never derived from or sent to the network.
hostname-mode=none

[device]
# Random MAC address in probe requests while scanning.
wifi.scan-rand-mac-address=yes

[connection]
# A per-boot, per-connection DHCP client identifier instead of the MAC.
ipv4.dhcp-client-id=stable
connection.stable-id=${CONNECTION}/${BOOT}
