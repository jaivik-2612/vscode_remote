<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  SPDX-License-Identifier: GPL-3.0-or-later
  Roboto (fonts-roboto-unhinted) as the generic sans-serif face, so programs
  that ask for "sans-serif" rather than the GNOME interface font (Qt apps
  such as Electrum and OnionShare) match the rest of the interface. Each
  <prefer> is inserted just before the generic name, so earlier files win:
  after 50-user.conf and 51-local.conf (a user's or administrator's choice
  stays first), before 60-latin.conf's distribution defaults. Tor Browser
  does not read this directory; it uses its own fonts.conf and bundled fonts.
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Roboto</family>
    </prefer>
  </alias>
</fontconfig>
