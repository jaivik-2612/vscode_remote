# Debian's unit skips loading AppArmor profiles on live systems that use an
# overlayfs root (ConditionPathExists=!/run/live/overlay/work), which is
# what Antumbra is. Without this reset Tor and every other profiled program
# would run unconfined. Tails is not affected only because its patched
# live-boot keeps the overlay elsewhere. The empty assignment clears every
# ConditionPathExists= of the packaged unit.
[Unit]
ConditionPathExists=
