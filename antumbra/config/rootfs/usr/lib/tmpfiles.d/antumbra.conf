d /var/lib/antumbra/settings 0755 root root -
d /var/lib/antumbra/settings/persistent 0750 antumbra-greeter antumbra-greeter -
d /var/lib/antumbra/settings/transient 0750 antumbra-greeter antumbra-greeter -
d /var/lib/antumbra/settings/applied 0755 root root -
