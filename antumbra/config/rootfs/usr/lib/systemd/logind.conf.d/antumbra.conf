[Login]
# Short press: the shell handles the screen; long press (5 s): orderly
# power-off, the fastest path to memory erasure.
HandlePowerKey=ignore
HandlePowerKeyLongPress=poweroff
IdleAction=ignore
KillUserProcesses=yes
# No text logins on virtual terminals (the amnesia account has no password
# and the greeter is the only way in): logind never spawns autovt gettys.
NAutoVTs=0
ReserveVT=0
