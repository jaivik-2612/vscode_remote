name: Deploy PWA to GitHub Pages

on:
  push:
    branches: ['**']
    paths:
      - 'web/**'
      - 'src/**'
      - 'data/**'
      - 'build-artifact.mjs'
      # The hosted privacy policy is generated from this file, and both app
      # stores require that URL to be live and current.
      - 'docs/store/PRIVACY.md'
      - 'docs/store/TERMS.md'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The web app itself has no dependencies; nothing to install.
      - name: Run the engine test suite
        run: npm test

      - name: Build the installable app
        run: node build-artifact.mjs --pwa

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/pwa

      - id: deployment
        uses: actions/deploy-pages@v4
