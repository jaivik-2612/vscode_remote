name: Release builds

# Triggered by a v* tag, a release/** pointer branch (the git proxy in the
# development environment cannot push tags), or manual dispatch.
on:
  push:
    tags: ["v*"]
    branches: ["release/**"]
  create:
  workflow_dispatch:

env:
  FLUTTER_VERSION: 3.44.8

permissions:
  contents: write

# The `create` event has no ref filter, so gate every job instead.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    if: >-
      github.event_name != 'create' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/tags/v')
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - run: mv build/app/outputs/flutter-apk/app-release.apk waypoint-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: waypoint-android
          path: waypoint-android.apk

  linux:
    if: >-
      github.event_name != 'create' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/tags/v')
    name: Linux bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release
      - run: tar czf waypoint-linux-x64.tar.gz -C build/linux/x64/release/bundle .
      - uses: actions/upload-artifact@v4
        with:
          name: waypoint-linux
          path: waypoint-linux-x64.tar.gz

  windows:
    if: >-
      github.event_name != 'create' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/tags/v')
    name: Windows bundle
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath waypoint-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: waypoint-windows
          path: waypoint-windows-x64.zip

  macos:
    if: >-
      github.event_name != 'create' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/tags/v')
    name: macOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release
      # ditto preserves the .app bundle structure and symlinks.
      - run: ditto -c -k --keepParent build/macos/Build/Products/Release/waypoint.app waypoint-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: waypoint-macos
          path: waypoint-macos.zip

  ios:
    if: >-
      github.event_name != 'create' ||
      startsWith(github.ref, 'refs/heads/release/') ||
      startsWith(github.ref, 'refs/tags/v')
    name: iOS app (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -qr waypoint-ios-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: waypoint-ios
          path: waypoint-ios-unsigned.ipa

  release:
    name: Publish GitHub release
    needs: [android, linux, windows, macos, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME#release/}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Waypoint $TAG" \
            --notes "Test builds for all five platforms. See README for install notes (macOS app and iOS IPA are unsigned)." \
            waypoint-android.apk \
            waypoint-linux-x64.tar.gz \
            waypoint-windows-x64.zip \
            waypoint-macos.zip \
            waypoint-ios-unsigned.ipa
