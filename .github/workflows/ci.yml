name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Verify drift codegen is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code
      - run: flutter analyze
      - run: flutter test
